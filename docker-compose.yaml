services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: releasecheck
      POSTGRES_USER: releasecheck
      POSTGRES_PASSWORD: releasecheck_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasecheck -d releasecheck"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./server
    environment:
      PORT: 4000
      DATABASE_URL: postgres://releasecheck:releasecheck_dev@db:5432/releasecheck
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  pgdata:
